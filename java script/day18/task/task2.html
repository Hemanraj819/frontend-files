<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            text-align: center;
            padding: 50px;
        }

        .form {
            width: 300px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 25px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="form">

        <h2>Login</h2>

        <input type="email" id="email" placeholder="Enter Email">
        <input type="password" id="password" placeholder="Enter Password">

        <button onclick="login()">Login</button>

        <p>Don't have an account?</p>
        <a href="register.html">Register</a>

    </div>



    <script src="./asset/task2.js"></script>



    
</body>

</html>
