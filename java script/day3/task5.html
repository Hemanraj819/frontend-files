<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> increment</title>
</head>
<body>
    

    <script>
        let count=10;

        count++
        console.log(count);
        count++
        console.log(count);
        count--
        console.log(count);
        count--
        console.log(count);
        
        
        
        
    </script>
</body>
</html>
