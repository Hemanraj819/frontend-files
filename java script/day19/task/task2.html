<body>


    <h1>Promise using resolve and reject</h1>


    <script>
        
    const myPromise = new Promise((resolve, reject) => {
    let success = true;

    if (success) {
        resolve("Success");
    } else {
        reject("Failed");
    }
});
    </script>
