<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or Odd</title>
</head>
<body>
    <h1>Even or Odd</h1>

    <script>
        let number=15;


        if (number % 3 === 0){
            console.log("Even");
            
        }else{
            console.log("odd");
            
        }
    </script>


</body>
