<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 100px;
      height: 100px;
      margin: 10px;
      padding: 20px;
    }

    .box1 {
      background-color: red;
    }

    .box2 {
      background-color: blue;
      position: relative;
      top: 40px;
      left: 60px;
    }

    .box3 {
      background-color: green;
    }
  </style>
</head>
<body>

  <div class="box box1">Box 1</div>

  <div class="box box2">Box 2</div>

  <div class="box box3">Box 3</div>

</body>
</html>
