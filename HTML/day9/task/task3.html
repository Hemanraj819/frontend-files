<body>
    <header>
        <center>
             <h1>Apollo Hospital Patient Registration System.</h1>
        </center>
       
    </header>
         
    
    <form>
        <label for="Patient">Patient Id</label>
        <input type="text" id=" Patient" placeholder="Enter your id" required> <br> <br>
        <label for="name">Patient Name</label>
        <input type="text" id="name" placeholder="Enter your name" required><br><br>
         <label for="age">Your Age</label>
        <input type="tel" id="age" placeholder="Enter your age" max="60" min="18" required><br><br>
        <label for="gender">Gender</label><br>
        <input type="radio" name="gender"  id="gender">Male
        <input type="radio" name="gender" id="gender">Female <br> 
        <br>
        <label for="blood">Blood Group</label>
        <input type="text" id="blood" placeholder="Enter your blood group" required><br><br>
        <label for="doctor">Doctor</label>
        <input type="text" id="doctor" placeholder="Enter your doctor name" required><br><br>
        <label for="Symptoms">Symptoms</label>
        <input type="text" id="Symptoms" placeholder="Enter your Symptoms" required><br><br>
        
         <label for="date">Appointment date</label> <br>
         <input type="date" id="date">
    
        <br>
        <br>
        <label for="profile">Medical Report upload</label> <br>
        <input type="file"><br>
        <br>
        <input type="submit" value="Submit" >
   
    </form>
