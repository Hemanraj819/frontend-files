<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Page</title>
</head>
<body>
    <header>
        <h1>FORM PAGE</h1>
    </header>
     <section>
        <div>
            <form> 

                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your name" required><br> <br><br>
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required><br><br>
                <label for="password">password</label>
                <input type="text" id="password" placeholder="Enter your password " required><br><br>
                <label for="phone">Mobile number</label>
                <input type="tel" id="phone" placeholder="Enter your number" required><br><br>
                <label for="gender">Gender</label>
                <input type="radio" name="Gender" id="gender">Male
                <input type="radio" name="Gender" id="gender">Female <br><br>
                <label for="databirth">Data Birth</label>
                <input type="date" id="databirth"><br><br>

            </form>
        </div>
     </section>






    
</body>
</html>
