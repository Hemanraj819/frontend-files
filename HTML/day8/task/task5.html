<!DOCTYPE html>
<html>
<head>
    <title>Job Application</title>
</head>
<body>
    <header>
        <center>
            <h2>Job Application Form</h2>
        </center>
    </header>
    

    <form>
        <label for="">Name</label>
        <input type="text" placeholder="Enter your full name"><br><br>

        <label for="">Email</label>
        <input type="email" placeholder="Enter your email"><br><br>

        <label for="">phone</label>
        <input type="tel" placeholder="Enter your number"><br><br>

         <label for="">Gender</label><br><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>

        <label for="">Date Of Birth</label><br><br>        
        <input type="date"><br><br>


        <label for="">What position are  you applying for?</label> <br>
        <br>
        <select>
            <option >please select</option>
            <option>Web Developer</option>
            <option>Software Engineer</option>
            <option>Tester</option>
        </select>
            <br><br>

            <label for="">What is your current employment ststus?</label> <br>
            <input type="checkbox"> Employed <br>
            <input type="checkbox"> self-Employed <br>
            <input type="checkbox"> unemployed <br>
            <input type="checkbox"> student <br>
            <br>
       
       <br>

         <label for=""> Upload Resume</label><br>        
        <input type="file"><br><br>

        Experience:<br>
        <textarea rows="7" cols="30"> Message</textarea><br><br>

        <input type="submit" value="Apply">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
