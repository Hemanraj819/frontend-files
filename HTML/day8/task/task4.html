<!DOCTYPE html>

    <title>Feedback form</title>
</head>
<body>
    <header>
        <h1>Feedback Form</h1>
    </header>


<form>

    <label for="">Subject</label>

    <label for="">Message</label><br>
    <textarea rows="5" cols="30"></textarea><br>

    <br><br>

    <input type="submit" value="submit">


 </form>


    
</body>
</html>
